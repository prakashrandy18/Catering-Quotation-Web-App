<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New event</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2D5A12}a:hover{color:#1d3d0b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFBF9; font-family: Inter, sans-serif; color: #1c1f1a; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 12px 8px; display: flex; align-items: center; gap: 4px">
    <a href="F01-Events.dc.html" aria-label="Back to events" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1c1f1a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 style="margin: 0; font: 600 20px Poppins, sans-serif">New event</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 8px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="en" style="font-size: 13px; font-weight: 600">Event name</label><input id="en" placeholder="Bride / client name + occasion" style="height: 50px; border-radius: 14px; border: 2px solid {{brand}}; padding: 0 14px; font: 16px Inter, sans-serif; background: #fff"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="sd" style="font-size: 13px; font-weight: 600">From</label><input id="sd" placeholder="DD-MM-YYYY" style="min-width: 0; height: 50px; border-radius: 14px; border: 1px solid #DADAD5; padding: 0 14px; font: 15px Inter, sans-serif; background: #fff"></div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="ed" style="font-size: 13px; font-weight: 600">To</label><input id="ed" placeholder="DD-MM-YYYY" style="min-width: 0; height: 50px; border-radius: 14px; border: 1px solid #DADAD5; padding: 0 14px; font: 15px Inter, sans-serif; background: #fff"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="loc" style="font-size: 13px; font-weight: 600">Location</label><input id="loc" placeholder="Hall / area" style="height: 50px; border-radius: 14px; border: 1px solid #DADAD5; padding: 0 14px; font: 15px Inter, sans-serif; background: #fff"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="cl" style="font-size: 13px; font-weight: 600">Client phone <span style="font-weight: 400; color: #5b6156">(optional)</span></label><input id="cl" placeholder="10-digit number" style="height: 50px; border-radius: 14px; border: 1px solid #DADAD5; padding: 0 14px; font: 15px Inter, sans-serif; background: #fff"></div>

    <div style="font-size: 13px; font-weight: 600; margin-top: 4px">Start the menu from</div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <button onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 14px; border-radius: 16px; border: {{o.border}}; background: {{o.bg}}; text-align: left; font-family: Inter, sans-serif; color: #1c1f1a">
          <span style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid {{o.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{o.dot}}"></span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">{{o.title}}</span><span style="font-size: 12px; color: #5b6156">{{o.sub}}</span></span>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="padding: 12px 20px 28px">
    <a href="F03-Chat.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 18px; background: {{brand}}; color: #fff; font: 600 16px Inter, sans-serif; text-decoration: none">Create event</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#2D5A12","options":["#2D5A12","#7A1F2B","#1F4E79","#B8860B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'copy' }; }
  renderVals() {
    const brand = this.props.brand ?? '#2D5A12';
    const list = [
      { id: 'copy', title: 'Copy an old event', sub: 'Thara Wedding · 3 days · 11 sessions' },
      { id: 'tpl', title: 'Wedding template', sub: 'Viratham, Reception, Muhurtham sessions ready' },
      { id: 'blank', title: 'Blank', sub: 'Add days and sessions yourself, or tell Claude' }
    ];
    return {
      brand,
      options: list.map((o) => {
        const on = this.state.picked === o.id;
        return { ...o, border: on ? '2px solid ' + brand : '1px solid #E3E3DF', bg: on ? '#F1F6EC' : '#fff', ring: on ? brand : '#B9B9B3', dot: on ? brand : 'transparent', pick: () => this.setState({ picked: o.id }) };
      })
    };
  }
}
</script>
</body>
</html>
