<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Events home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2D5A12}a:hover{color:#1d3d0b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFBF9; font-family: Inter, sans-serif; color: #1c1f1a; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: {{brand}}; color: #fff; display: flex; align-items: center; justify-content: center; font: 700 15px Poppins, sans-serif">DL</div>
      <div style="flex: 1; line-height: 1.25"><div style="font: 600 15px Poppins, sans-serif">Dream Light</div><div style="font-size: 12px; color: #5b6156">Event Management</div></div>
      <a href="F11-Brand.dc.html" aria-label="Brand and settings" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E3E3DF; background: #fff; color: #1c1f1a; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></a>
    </div>
    <h1 style="margin: 4px 0 0; font: 700 28px Poppins, sans-serif">Your events</h1>
    <div style="position: relative">
      <label for="q" style="position: absolute; left: -9999px">Search events</label>
      <input id="q" placeholder="Search by client or date" style="box-sizing: border-box; width: 100%; height: 48px; border-radius: 14px; border: 1px solid #E3E3DF; padding: 0 16px 0 44px; font: 15px Inter, sans-serif; background: #fff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8f85" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #1c1f1a; color: #fff; font: 600 13px Inter, sans-serif">All</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; color: #1c1f1a; font: 500 13px Inter, sans-serif">Draft</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; color: #1c1f1a; font: 500 13px Inter, sans-serif">Sent</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; color: #1c1f1a; font: 500 13px Inter, sans-serif">Confirmed</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 8px 20px; display: flex; flex-direction: column; gap: 12px">
    <a href="F03-Chat.dc.html" style="display: flex; flex-direction: column; gap: 12px; background: #fff; border: 1px solid #E3E3DF; border-radius: 20px; padding: 18px; text-decoration: none; color: #1c1f1a; box-shadow: 0 2px 8px rgba(0,0,0,0.04)">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div><div style="font: 600 18px Poppins, sans-serif">Thara Wedding</div><div style="font-size: 13px; color: #5b6156; margin-top: 2px">24 – 26 Feb 2027 · Avadi</div></div>
        <span style="font: 600 11px Inter, sans-serif; background: #FFF1D6; color: #7A4B00; padding: 5px 10px; border-radius: 999px">Draft</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="background: #F5F5F3; border-radius: 12px; padding: 8px 10px"><div style="font-size: 11px; color: #5b6156">Days</div><div style="font-weight: 600">3</div></div>
        <div style="background: #F5F5F3; border-radius: 12px; padding: 8px 10px"><div style="font-size: 11px; color: #5b6156">Sessions</div><div style="font-weight: 600">11</div></div>
        <div style="background: #E6EEDF; border-radius: 12px; padding: 8px 10px"><div style="font-size: 11px; color: {{brand}}">Total</div><div style="font-weight: 700; color: {{brand}}">₹6,00,000</div></div>
      </div>
    </a>
    <div style="display: flex; flex-direction: column; gap: 12px; background: #fff; border: 1px dashed #D6D6D1; border-radius: 20px; padding: 18px; color: #8a8f85">
      <div style="display: flex; justify-content: space-between"><div><div style="font: 600 18px Poppins, sans-serif">[Next client event]</div><div style="font-size: 13px; margin-top: 2px">[Dates] · [Location]</div></div><span style="font: 600 11px Inter, sans-serif; background: #E8F0FA; color: #1F4E79; padding: 5px 10px; border-radius: 999px; align-self: flex-start">Sent</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; background: #fff; border: 1px dashed #D6D6D1; border-radius: 20px; padding: 18px; color: #8a8f85">
      <div style="display: flex; justify-content: space-between"><div><div style="font: 600 18px Poppins, sans-serif">[Past client event]</div><div style="font-size: 13px; margin-top: 2px">[Dates] · [Location]</div></div><span style="font: 600 11px Inter, sans-serif; background: #E6EEDF; color: {{brand}}; padding: 5px 10px; border-radius: 999px; align-self: flex-start">Confirmed</span></div>
    </div>
  </main>

  <div style="padding: 12px 20px 28px">
    <a href="F02-NewEvent.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 58px; border-radius: 18px; background: {{brand}}; color: #fff; font: 600 16px Inter, sans-serif; text-decoration: none; box-shadow: 0 8px 20px rgba(45,90,18,0.25)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New event</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#2D5A12","options":["#2D5A12","#7A1F2B","#1F4E79","#B8860B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { brand: this.props.brand ?? '#2D5A12' };
  }
}
</script>
</body>
</html>
