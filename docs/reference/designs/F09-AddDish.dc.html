<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add dish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2D5A12}a:hover{color:#1d3d0b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFBF9; font-family: Inter, sans-serif; color: #1c1f1a; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 12px 8px 4px; display: flex; align-items: center; gap: 4px">
    <a href="F08-Session.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1c1f1a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="flex: 1"><h1 style="margin: 0; font: 600 18px Poppins, sans-serif">Add dish</h1><div style="font-size: 12px; color: #5b6156">to Vilayadal Evening (Snacks)</div></div>
  </header>

  <div style="padding: 10px 16px; position: relative">
    <label for="ds" style="position: absolute; left: -9999px">Search dishes</label>
    <input id="ds" value="sam" style="box-sizing: border-box; width: 100%; height: 52px; border-radius: 16px; border: 2px solid {{brand}}; padding: 0 16px 0 46px; font: 16px Inter, sans-serif; background: #fff">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b6156" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 32px; top: 26px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </div>

  <main style="flex: 1; overflow: hidden; padding: 4px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="font: 600 12px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6156">From your dish library</div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #E3E3DF; border-radius: 16px; overflow: hidden">
      <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
        <li style="border-bottom: 1px solid #F0F0EC">
          <button onClick="{{r.toggle}}" style="display: flex; width: 100%; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border: 0; background: {{r.bg}}; text-align: left; font-family: Inter, sans-serif; color: #1c1f1a">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: #5b6156">{{r.cat}}</span></span>
            <span style="width: 32px; height: 32px; border-radius: 999px; background: {{r.btnBg}}; color: {{r.btnFg}}; border: {{r.btnBorder}}; display: flex; align-items: center; justify-content: center; font: 700 16px Inter, sans-serif">{{r.mark}}</span>
          </button>
        </li>
      </sc-for>
      <li><button style="display: flex; width: 100%; align-items: center; min-height: 54px; padding: 0 14px; border: 0; background: #fff; font: 600 14px Inter, sans-serif; color: {{brand}}; text-align: left">+ Add “sam” as a new dish</button></li>
    </ul>

    <div style="font: 600 12px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6156; margin-top: 4px">Often in snacks</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; font: 500 14px Inter, sans-serif; color: #1c1f1a">+ Cutlet</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; font: 500 14px Inter, sans-serif; color: #1c1f1a">+ Bonda Bajji</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; font: 500 14px Inter, sans-serif; color: #1c1f1a">+ Pani Poori</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E3DF; background: #fff; font: 500 14px Inter, sans-serif; color: #1c1f1a">+ Cheese Balls</button>
    </div>
  </main>

  <div style="padding: 12px 16px 28px">
    <a href="F08-Session.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{brand}}; color: #fff; font: 600 16px Inter, sans-serif; text-decoration: none">{{doneLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#2D5A12","options":["#2D5A12","#7A1F2B","#1F4E79","#B8860B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { added: ['Samosa'] }; }
  renderVals() {
    const brand = this.props.brand ?? '#2D5A12';
    const added = this.state.added;
    const list = [
      { name: 'Samosa', cat: 'Snacks' },
      { name: 'Sambar Vadai', cat: 'Vadai' },
      { name: 'Mini Sambar Idly', cat: 'Tiffin' },
      { name: 'Sambar', cat: 'Kulambu' }
    ];
    return {
      brand,
      doneLabel: added.length ? 'Done · ' + added.length + ' added' : 'Done',
      results: list.map((r) => {
        const on = added.includes(r.name);
        return { ...r, bg: on ? '#F1F6EC' : '#fff', mark: on ? '✓' : '+', btnBg: on ? brand : '#fff', btnFg: on ? '#fff' : brand, btnBorder: on ? '0' : '1.5px solid ' + brand,
          toggle: () => this.setState({ added: on ? added.filter((x) => x !== r.name) : added.concat(r.name) }) };
      })
    };
  }
}
</script>
</body>
</html>
